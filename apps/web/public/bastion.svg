<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Bastion">
  <!--
    The Bastion mark: two mirrored brackets closing into a gate with an aperture
    at the centre. Same geometry as the verdict marker in the policy ledger, so
    the identity and the product are drawn from one system.
  -->
  <rect width="24" height="24" rx="5" fill="#14120e"/>
  <g fill="none" stroke="#f66a17" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.1 5 L5.2 8.2 L5.2 15.8 L10.1 19"/>
    <path d="M13.9 5 L18.8 8.2 L18.8 15.8 L13.9 19"/>
  </g>
</svg>
