[package]
name = "bastion-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Durable workflow engine for Bastion. Multi-step agent actions with crash recovery and deterministic replay."

[dependencies]
bastion-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sled = "0.34"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
async-trait = "0.1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
