[package]
name = "bastion-audit"
version = "0.2.0"
# Anchor 0.30.1's manifest parser only understands editions up to 2021; keeping
# the on-chain crate on 2024 breaks `anchor build` / `anchor deploy` / `anchor test`
# with "data did not match any variant of untagged enum Inheritable".
edition = "2021"
description = "On-chain trust ledger for the Bastion Trust Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
devnet = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18"
borsh = "1"
thiserror = "2"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
