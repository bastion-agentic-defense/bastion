[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@solady/=lib/solady/src/",
    "@agent-ercs/=lib/agent-ercs/contracts/",
    "@capv/=lib/confidential-agent-policy-verdicts/src/",
]
solc = "0.8.28"
optimizer = true
optimizer_runs = 2000
evm_version = "cancun"
via_ir = true
gas_reports = ["*"]

[profile.ci]
verbosity = 3
ffi = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "short"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
ethereum = "${ETH_RPC_URL}"
ethereum_sepolia = "${ETH_SEPOLIA_RPC_URL}"
celo = "${CELO_RPC_URL}"
celo_testnet = "${CELO_TESTNET_RPC_URL}"
celo_sepolia = "${CELO_SEPOLIA_RPC_URL}"
zksync = "${ZKSYNC_RPC_URL}"
zksync_sepolia = "${ZKSYNC_SEPOLIA_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
# Monad is a standard EVM chain (no special tooling needed beyond its RPC endpoint).
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[etherscan]
ethereum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
