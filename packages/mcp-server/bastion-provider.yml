# Bastion - Provider Spec
name: bastion
description: Bastion Programmable Trust Runtime. Non-profit, open source. Free tier with optional paid backend API calls via USDT/USDC.

endpoints:
  - id: health
    path: /mcp/health
    method: GET
    description: Health check (free)

  - id: pricing
    path: /mcp/pricing
    method: GET
    description: Tool pricing and free tier info (free)

  - id: sse
    path: /mcp/sse
    method: GET
    description: SSE connection for MCP transport (free)

  - id: simulate
    path: /mcp/messages
    method: POST
    description: Simulate a transaction through Bastion policy engine

  - id: override
    path: /mcp/messages
    method: POST
    description: Human override for a blocked transaction
