# Apalache model checker configuration
#
# Usage: apalache-mc check --config=fv/policy-engine/PolicyEvaluator.cfg fv/policy-engine/PolicyEvaluator.tla
#
# Checks all 5 theorems:
# - RuleOrdering: first blocking rule determines outcome
# - Completeness: all-pass produces Pass
# - Determinism: same inputs, same output
# - NoSilentSkip: every rule before Block is checked
# - HITLPrecedence: HITL beats Block

CONSTANT
  MaxRules = 3
  MaxAmount = 100

INIT
  TRUE

NEXT
  TRUE

INVARIANT
  RuleOrderingIsCorrect
  EvaluationIsComplete
  EvaluationIsDeterministic
  NoRulesSilentlySkipped
  HITLBeforeBlock
