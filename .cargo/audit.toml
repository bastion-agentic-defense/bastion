# cargo-audit configuration.
#
# After the full-EVM pivot, Solana/Arcium (and their transitive advisories:
# curve25519-dalek 3.x, ed25519-dalek 1.x, quinn-proto, ring 0.16, rustls-webpki,
# time 0.3) are no longer in the dependency graph. The remaining pinned
# advisories below come from deep transitive deps we don't control directly
# (sled → crossbeam-epoch/fxhash/instant; reqwest/hyper → h2/rustls-pemfile):
# two are real (but unpatchable without a semver-major bump upstream), three
# are informational "unmaintained crate" notices with no known vulnerability
# and no patched version to move to.
#
# The allowlist is explicit and reviewed: any NEW advisory not listed here will
# still fail `cargo audit` in CI.
[advisories]
ignore = [
    # crossbeam-epoch 0.9.18 — invalid pointer deref (via sled)
    "RUSTSEC-2026-0204",
    # h2 0.4.14 — unbounded empty DATA frames (via reqwest → hyper)
    "RUSTSEC-2026-0258",
    # fxhash 0.2.1 — unmaintained (via sled), no vulnerability, no patched version
    "RUSTSEC-2025-0057",
    # instant 0.1.13 — unmaintained (via sled → parking_lot), no vulnerability
    "RUSTSEC-2024-0384",
    # rustls-pemfile 2.2.0 — unmaintained (via reqwest), no vulnerability
    "RUSTSEC-2025-0134",
]
